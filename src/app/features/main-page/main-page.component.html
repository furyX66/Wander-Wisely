<app-header/>
<main>
  <app-main-title/>
  <div class="input-row">
    <app-chat-input
      [disabled]="false"
      (onClick)="handleChatInput($event)"
    ></app-chat-input>
    @if ((isLoggedIn$ | async)) {
      <button (click)="handleNavigateToChats()">Go to chats</button>
    }
  </div>
</main>
