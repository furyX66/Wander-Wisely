
<h1>Your trips</h1>

<div class="search-input-container">
  <icon-search/>
  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="onSearchChange(searchQuery)"
    class="search-input"
    placeholder="Search trips">
  <button class="search-clear-btn" (click)="clearSearch()" type="button">
    <icon-cross [strokeWidth]="1.5"/>
  </button>
</div>

<section class="trips-list">
  @if (filteredTrips.length > 0) {
    @for (trip of filteredTrips; track trip.id) {
      <div class="trip-card" (click)="openTripInChat(trip)">
        <img [src]="trip.route[0].photoUrl" alt="Trip image">
        <div class="trip-card-info">
          <h3>{{ trip.name }}</h3>
          <p>Budget: <span>{{ trip.budget }}$</span></p>
        </div>
      </div>
    }
  } @else {
    <p>No trips found</p>
  }
</section>
