@let isLoggedIn = (isLoggedIn$ | async);
<div class="side-bar">
  <app-logo/>
  <nav class="option-buttons">
    <ul>
      <li>
        <button class="chat-list-font">
          <icon-search/>
          Search chats
        </button>
      </li>
      <li>
        <button class="chat-list-font">
          <icon-new-chat/>
          New chat
        </button>
      </li>
    </ul>
  </nav>
  <div class="chat-list">

    @if (!isLoggedIn) {
      <p class="not-login-massage">
        Sign up or login to get access to history, more chats etc.
      </p>
    }
  </div>
  @if (!isLoggedIn) {
    <span class="bottom-bar">
      <app-login-button (click)="openLoginModal()"/>
      <app-sign-up-button (click)="openRegistrationModal()"/>
      <app-color-scheme-switch/>
    </span>
  } @else {
    <span class="user-bottom-menu">
      <button (click)="toggleUserMenu()">
        <icon-profile/>
        <p>{{ (user$ | async)?.username }}</p>
      </button>
      <app-color-scheme-switch/>
    </span>
  }
</div>

@if (showUserMenu) {
  <app-user-menu/>
}
