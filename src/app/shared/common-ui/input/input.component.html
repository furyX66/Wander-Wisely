<div class="input-wrapper" style="position: relative;">
  @if (label()) {
    <label class="font-s-medium" [for]="id()">{{ label() }}</label>
  }
  <input
    [id]=id()
    [type]="type() === 'password' && !showPassword ? 'password' : 'text'"
    [placeholder]="placeholder()"
    [name]="name()"
    [autocomplete]="autocomplete()"
    [required]="required()"
    [value]="internalValue"
    (input)="onInput($event)"
    class="custom-input font-s-light"
  />
  @if (type() === 'password') {
    <button
      type="button"
      (click)="togglePasswordVisibility()"
      tabindex="-1"
    >
      @if (!showPassword) {
        <icon-eye/>
      }
      @if (showPassword) {
        <icon-eye-off/>
      }
    </button>
  }
</div>
