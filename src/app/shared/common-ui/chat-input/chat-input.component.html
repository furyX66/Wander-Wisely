<div class="input-container">
  <input
    type="text"
    [placeholder]="placeholder()"
    [(ngModel)]="inputValue"
    (keydown.enter)="onSendClick()"
  />
  <button type="button"
          (click) ="onSendClick()"
          [disabled]="disabled() || !inputValue.trim()"
          [class.loading]="disabled()">
    <icon-send/>
  </button>
</div>
