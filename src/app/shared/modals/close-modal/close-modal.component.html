<div class="modal-backdrop" style="z-index: 2000;" (click)="closeModal()"></div>
<div class="modal-wrapper" style="z-index: 2000;">
  <h1>Are you sure?</h1>
  <p class="font-s-light" style="text-align: center">Are you sure you want to close this window? All unsaved data will be lost</p>
  <app-button [variant]="'yellow'" (click)="handleStay()">Stay</app-button>
  <app-button [variant]="'outlined'" (click)="handleClose()">Yes, close</app-button>
</div>
