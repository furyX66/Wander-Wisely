<app-logo/>
@if (!(authStatus$ | async)) {
  <span class="menu-buttons">
      <app-color-scheme-switch/>
      <app-login-button (click)="openLoginModal()"/>
      <app-sign-up-button (click)="openRegistrationModal()"/>
    </span>
} @else {
  <span class="user-signed">
        <app-color-scheme-switch/>
        <button (click)="toggleUserMenu()">
          <p>{{ (user$ | async)?.username }}</p>
        <icon-profile/>
        </button>
      </span>
}
@if (showUserMenu) {
  <app-user-menu (closeMenu)="toggleUserMenu()"/>
}
