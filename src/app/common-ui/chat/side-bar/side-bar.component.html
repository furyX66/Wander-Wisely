<div class="side-bar">
  <div class="chats-with-logo">
    <app-logo/>
    <div class="chats">
      <div class="option-buttons">
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path
              d="M1.49217 14.2314L1.49166 14.2304C0.856658 12.9555 0.5 11.5189 0.5 9.99999C0.5 7.48044 1.50089 5.06408 3.28249 3.28248C5.06408 1.50089 7.48044 0.5 10 0.5C15.2469 0.5 19.5 4.75306 19.5 9.99999C19.5 15.2469 15.2469 19.5 10 19.5H9.99917C8.53145 19.5024 7.08334 19.1629 5.76965 18.5084C5.39005 18.3188 4.92107 18.345 4.39114 18.4755L4.39114 18.4755L4.38669 18.4767C4.12072 18.5448 3.85775 18.6241 3.5985 18.7145L3.5984 18.7146L3.51314 18.7443C3.28445 18.8209 3.0553 18.8973 2.84397 18.9539C1.75349 19.2461 0.753877 18.2472 1.046 17.1552C1.10269 16.9445 1.17941 16.7136 1.25557 16.4872L1.28543 16.4016L1.28547 16.4015C1.37584 16.1422 1.4552 15.8793 1.52333 15.6133L1.52336 15.6133L1.52468 15.6079C1.65421 15.0778 1.67965 14.61 1.49217 14.2314Z"
              fill="var(--text-color)" stroke="var(--text-color)"/>
          </svg>
          <p>Chats</p>
        </div>
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <g clip-path="url(#clip0_1_186)">
              <rect x="0.5" y="0.5" width="19" height="19" rx="4.5" stroke="var(--text-color)"/>
              <path d="M10 5.5V14.5" stroke="var(--text-color)" stroke-linecap="round"/>
              <path d="M5.5 10L14.5 10" stroke="var(--text-color)" stroke-linecap="round"/>
            </g>
            <defs>
              <clipPath id="clip0_1_186">
                <rect width="20" height="20" fill="none"/>
              </clipPath>
            </defs>
          </svg>
          <p>New chat</p>
        </div>
      </div>
    </div>
  </div>
  @if (!(isLoggedIn$  | async)) {
    <p class="not-login-massage">Sign up or login to get access to history, more chats etc.</p>
    <section class="bottom-bar">
      <app-login-button (click)="openLoginModal()"/>
      <app-sign-up-button (click)="openRegistrationModal()"/>
      <app-color-scheme-switch/>
    </section>
  } @else {
    <section class="bottom-bar">
      <icon-profile/>
      <p (click)="toggleUserMenu()" style="cursor:pointer" >{{ (user$ | async)?.username }}</p>
      <app-color-scheme-switch/>
    </section>
  }
</div>
@if (showUserMenu){
  <app-user-menu/>
}
@if (showRegistrationModal) {
  <app-register-modal (switchToLogin)="handleSwitchToLogin()" (close)="closeModals()"/>
}
@if (showLoginModal) {
  <app-login-modal (switchToRegister)="handleSwitchToRegister()" (close)="closeModals()"/>
}
